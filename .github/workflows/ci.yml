name: MolAlembic CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Bytecode compilation check
        run: python -m compileall -q src

      - name: Lint check with flake8
        run: flake8 src tests examples --max-line-length=120 --extend-ignore=E203

      - name: Static type check with mypy
        run: mypy src

      - name: Run pytest suite
        run: pytest -v

      - name: CLI smoke tests
        run: |
          mol-alembic --help
          mol-alembic demo --seed 42
          python -m mol_alembic.cli screen --epochs 18 --seed 7
          python -m mol_alembic.cli adme --smiles "CC(=O)Oc1ccccc1C(=O)O" --dose-mg 100
          python -m mol_alembic.cli dock --smiles "COc1cc2ncnc(Nc3ccc(F)c(Cl)c3)c2cc1OCC" --seed 11
          python -m mol_alembic.cli protac --kd-poi-nm 12.0 --kd-e3-nm 35.0 --alpha 8.5
          python -m mol_alembic.cli optimize --generations 5 --pop-size 12 --seed 19

      - name: Run standalone examples
        run: |
          python examples/01_smiles_chemistry_and_scaffolds.py
          python examples/02_gnn_qsar_and_conformal_screening.py
          python examples/03_adme_pbpk_and_docking_pose.py
          python examples/04_protac_ternary_and_denovo_mpo.py
